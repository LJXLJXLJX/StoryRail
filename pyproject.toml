[project]
name = "storyrail"
version = "0.1.0"
description = "StoryRail（镜序）开源 Core 与可替换的模型 Provider 插件"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp==2.2.0", "pydantic>=2,<3"]
providers = ["pillow>=10,<13", "numpy>=1.26,<3"]
dev = [
    "mcp==2.2.0",
    "pydantic>=2,<3",
    "pillow>=10,<13",
    "jsonschema>=4,<5",
    "debugpy>=1.8,<2",
    "pytest>=8,<10",
    "pytest-xdist>=3,<4",
    "ruff>=0.12,<1",
    "build>=1,<2",
]

[tool.setuptools.packages.find]
include = ["core*", "default_model_providers_implement*", "server*", "integrations*", "storyrail_contracts*"]

[tool.setuptools.package-data]
"integrations.agent_launcher" = ["Dockerfile", "PROMPT.md"]
"core.director_proposals" = ["skills/*/SKILL.md", "skills/*/references/*.md", "skills/*/references/*.txt", "skills/*/agents/*.yaml", "skills/consistency_instruction.md"]

"core.model_providers.minimax_h3" = ["skills/*/SKILL.md", "skills/*/LICENSE", "skills/*/NOTICE", "skills/*/references/*.md", "skills/*/references/*.txt", "skills/*/agents/*.yaml"]
"core.model_providers.qwen_image" = ["skills/*/SKILL.md", "skills/*/LICENSE", "skills/*/NOTICE", "skills/*/references/*.txt", "skills/*/agents/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q -m 'not slow'"
testpaths = ["tests"]
markers = [
    "oracle: 真实驱动系统、断言可达状态的 oracle 场景（见 tests/README.md）",
    "slow: 默认跳过的重测试；ci_local.sh --full 或 -m 'not slow or slow' 全跑（见 tests/README.md）",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["wip"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
